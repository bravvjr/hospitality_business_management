# Backend CI (ADR-009): lint + unit/integration tests against Postgres.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hbm
          POSTGRES_PASSWORD: hbm
          POSTGRES_DB: hbm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hbm -d hbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      # App runs as the non-owner role so RLS is enforced (ADR-002).
      DATABASE_URL: postgresql+asyncpg://hbm_app:hbm_app@localhost:5432/hbm
      # Migrations run as the owner role.
      MIGRATION_DATABASE_URL: postgresql+asyncpg://hbm:hbm@localhost:5432/hbm
      JWT_SECRET_KEY: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Provision non-owner app role
        env:
          PGPASSWORD: hbm
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -U hbm -d hbm -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='hbm_app') THEN CREATE ROLE hbm_app LOGIN PASSWORD 'hbm_app' NOSUPERUSER NOBYPASSRLS; END IF; END \$\$;"
          psql -h localhost -U hbm -d hbm -v ON_ERROR_STOP=1 -c \
            "GRANT CONNECT ON DATABASE hbm TO hbm_app; GRANT USAGE ON SCHEMA public TO hbm_app; ALTER DEFAULT PRIVILEGES FOR ROLE hbm IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO hbm_app; ALTER DEFAULT PRIVILEGES FOR ROLE hbm IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO hbm_app;"

      - name: Ruff
        run: ruff check app tests alembic

      - name: Unit tests
        run: pytest -m unit

      - name: Apply migrations
        run: alembic upgrade head

      - name: Integration tests
        run: pytest -m integration
