[project]
name = "hospitality-business-management"
version = "0.1.0"
description = "Hospitality Business Management platform — FastAPI backend"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests that require a database",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
