# Local development stack (ADR-003 / ADR-005): API + Postgres as separate
# services, Postgres persisted on a named volume.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hbm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hbm}
      POSTGRES_DB: ${POSTGRES_DB:-hbm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hbm} -d ${POSTGRES_DB:-hbm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hbm}:${POSTGRES_PASSWORD:-hbm}@db:5432/${POSTGRES_DB:-hbm}
    ports:
      - "8000:8000"

volumes:
  pgdata:
